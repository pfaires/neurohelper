<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit · NeuroHelper</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="cabecalho"></div>

<main class="container">
  <p class="trilha"><a href="index.html">Início</a> ›
     <a href="#" id="trilha-ambulatorio">Ambulatório</a> › <span id="trilha-fim">Kit</span></p>
  <h2 id="titulo-pagina"></h2>
  <p class="sub" id="sub-pagina"></p>

  <form id="form-kit" novalidate>
    <fieldset class="bloco" id="bloco-comuns" hidden>
      <legend>Dados comuns aos documentos</legend>
      <p class="nota">O que for preenchido aqui vai para todos os documentos marcados. Depois dá para ajustar cada um individualmente.</p>
      <div id="campos-comuns"></div>
    </fieldset>

    <fieldset class="bloco">
      <legend>Documentos do kit</legend>
      <p class="nota">Os textos vêm prontos como rascunho e podem ser revisados depois, no atendimento.</p>
      <div id="itens-kit"></div>
    </fieldset>

    <div class="acoes">
      <button type="submit" class="btn-primario" id="btn-incluir">Incluir no atendimento</button>
      <a class="btn-secundario botao-link" href="atendimento.html">Ir para o atendimento</a>
    </div>

    <p class="aviso" id="aviso"></p>
  </form>
</main>

<div id="rodape"></div>

<script src="assets/js/pdf-comum.js"></script>
<script src="assets/js/campos.js"></script>
<script src="assets/js/armazenamento.js"></script>
<script src="assets/js/cabecalho.js"></script>
<script src="assets/js/doc-mudanca-procedimento.js"></script>
<script src="assets/js/doc-apac.js"></script>
<script src="assets/js/doc-requisicao-exames.js"></script>
<script src="assets/js/doc-receituario-simples.js"></script>
<script src="assets/js/doc-receituario-controle-especial.js"></script>
<script src="assets/js/kits.js"></script>
<script src="assets/js/ambulatorios.js"></script>
<script src="assets/js/pag-kit.js"></script>
</body>
</html>
